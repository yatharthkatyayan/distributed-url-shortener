## postgres config

spring.datasource.url=jdbc:postgresql://localhost:5432/urlshortener
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

## redis config

spring.data.redis.host=localhost
spring.data.redis.port=6379

## kafka config

spring.kafka.bootstrap-servers=localhost:9092

spring.kafka.consumer.group-id=url-analytics-group
spring.kafka.consumer.auto-offset-reset=earliest

spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer

spring.kafka.consumer.properties.spring.json.trusted.packages=com.yatharth.distributedurlshortener.event
spring.kafka.consumer.properties.spring.json.value.default.type=com.yatharth.distributedurlshortener.event.UrlCreatedEvent

## instance data

server.port=8080
app.instance-id=${INSTANCE_ID:${HOSTNAME:local}}
